version: '3'

includes:
  openapi:
    taskfile: taskfiles/OpenAPI.yml
  db:
    taskfile: taskfiles/Database.yml
  api:
    taskfile: taskfiles/API.yml
  dart:
    taskfile: taskfiles/Dart.yml
  flutter:
    taskfile: taskfiles/Flutter.yml
  verify:
    taskfile: taskfiles/Verify.yml
    flatten: true
  dev:
    taskfile: taskfiles/Development.yml

tasks:
  contract:update:
    desc: OpenAPI契約を検証し、Go・Dart生成物を更新する
    cmds:
      - task: openapi:validate
      - task: openapi:lint
      - task: api:generate
      - task: dart:generate
      - task: dart:build

  contract:verify:
    desc: OpenAPI契約変更後に全体検証を実行する
    cmds:
      - task: verify

  default:
    desc: 利用可能なタスクを表示する
    cmds:
      - task --list
