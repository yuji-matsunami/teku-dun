version: '3'

vars:
  # These values are passed to the shell script as environment variables. The
  # script validates them before using them and never embeds user input into a
  # generated shell command.
  TASK_EXE: '{{.TASK_EXE | default "task"}}'
  API_DIR: '{{.API_DIR | default "api"}}'
  SMOKE_API_ADDR: '{{.SMOKE_API_ADDR | default "127.0.0.1"}}'
  SMOKE_API_PORT: '{{.SMOKE_API_PORT | default "18080"}}'
  SMOKE_API_TIMEOUT: '{{.SMOKE_API_TIMEOUT | default "30"}}'

tasks:
  verify:
    desc: 端末不要の全コンポーネント検証を順番に実行する
    cmds:
      - task: openapi:validate
      - task: openapi:lint
      - task: api:verify
      - task: dart:verify
      - task: flutter:verify

  smoke:
    desc: DBとGo APIを一時起動し、healthz/readyzを検証して停止する
    dir: '{{.ROOT_DIR}}'
    env:
      TASK_EXE: '{{.TASK_EXE}}'
      API_DIR: '{{.API_DIR}}'
      SMOKE_API_ADDR: '{{.SMOKE_API_ADDR}}'
      SMOKE_API_PORT: '{{.SMOKE_API_PORT}}'
      SMOKE_API_TIMEOUT: '{{.SMOKE_API_TIMEOUT}}'
    cmds:
      - ./scripts/smoke.sh
