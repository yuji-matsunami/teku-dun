version: '3'

vars:
  FLUTTER_APP_DIR: '{{.FLUTTER_APP_DIR | default "mobile/app"}}'
  # FLUTTER is intentionally a command string so developers can override it
  # with a trusted local Flutter command, such as a pinned SDK path.
  FLUTTER: '{{.FLUTTER | default "fvm flutter"}}'
  API_BASE_URL: '{{.API_BASE_URL | default "http://10.0.2.2:8080"}}'

tasks:
  pub-get:
    desc: Flutterアプリの依存関係を取得する
    dir: '{{.ROOT_DIR}}/{{.FLUTTER_APP_DIR}}'
    cmds:
      - '{{.FLUTTER}} pub get'

  build:
    desc: Drift の生成コードを生成する
    cmds:
      - task: pub-get
      - task: build-runner

  build-runner:
    internal: true
    dir: '{{.ROOT_DIR}}/{{.FLUTTER_APP_DIR}}'
    cmds:
      - '{{.FLUTTER}} pub run build_runner build'

  build-check-only:
    internal: true
    dir: '{{.ROOT_DIR}}/{{.FLUTTER_APP_DIR}}'
    cmds:
      - |
        set -eu
        changed="$(git diff --name-only -- '*.g.dart')"
        if [ -n "$changed" ]; then
          echo 'Generated Dart files changed after build_runner:' >&2
          echo "$changed" >&2
          exit 1
        fi
        untracked="$(git ls-files --others --exclude-standard -- '*.g.dart')"
        if [ -n "$untracked" ]; then
          echo 'Generated Dart files are untracked; stage the build_runner output:' >&2
          echo "$untracked" >&2
          exit 1
        fi

  analyze:
    desc: Flutterアプリを静的解析する
    cmds:
      - task: pub-get
      - task: analyze-only

  analyze-only:
    internal: true
    dir: '{{.ROOT_DIR}}/{{.FLUTTER_APP_DIR}}'
    cmds:
      - '{{.FLUTTER}} analyze'

  test:
    desc: Flutterアプリのテストを実行する
    cmds:
      - task: pub-get
      - task: test-only

  test-only:
    internal: true
    dir: '{{.ROOT_DIR}}/{{.FLUTTER_APP_DIR}}'
    cmds:
      - '{{.FLUTTER}} test'

  run:
    desc: Flutterアプリを起動する（API_BASE_URLで接続先を変更可能）
    dir: '{{.ROOT_DIR}}/{{.FLUTTER_APP_DIR}}'
    env:
      API_BASE_URL: '{{.API_BASE_URL}}'
    cmds:
      - task: pub-get
      - '{{.FLUTTER}} run --dart-define=API_BASE_URL="$API_BASE_URL"'

  verify:
    desc: Flutterアプリの生成物・静的解析・テストをまとめて実行する
    cmds:
      - task: pub-get
      - task: build-runner
      - task: build-check-only
      - task: analyze-only
      - task: test-only
