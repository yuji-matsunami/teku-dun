version: '3'

vars:
  OAPI_CODEGEN_MODULE: 'github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen'

tasks:
  generate:
    desc: OpenAPIからGoサーバコードを生成する
    dir: '{{.ROOT_DIR}}/api'
    cmds:
      - |
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen \
          --config oapi-codegen.yaml \
          ../openapi/openapi.yaml

  generate-check:
    desc: OpenAPIからのGo生成物にドリフトがないことを検査する
    dir: '{{.ROOT_DIR}}/api'
    cmds:
      - |
        set -u
        tmp_dir=''
        cleanup() {
          exit_code=$?
          if [ -n "$tmp_dir" ] && [ -d "$tmp_dir" ]; then
            rm -f "$tmp_dir/openapi.gen.go" "$tmp_dir/oapi-codegen.yaml"
            rmdir "$tmp_dir"
          fi
          exit "$exit_code"
        }
        trap cleanup EXIT
        if ! tmp_dir="$(mktemp -d "${TMPDIR:-/tmp}/teku-dun-api-generate-check.XXXXXX")"; then
          echo 'failed to create a temporary directory' >&2
          exit 1
        fi
        if ! sed "s#output: internal/openapi/openapi.gen.go#output: $tmp_dir/openapi.gen.go#" \
          oapi-codegen.yaml > "$tmp_dir/oapi-codegen.yaml"; then
          echo 'failed to prepare the temporary oapi-codegen config' >&2
          exit 1
        fi
        if ! go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen \
          --config "$tmp_dir/oapi-codegen.yaml" \
          ../openapi/openapi.yaml; then
          echo 'Go code generation failed' >&2
          exit 1
        fi
        if ! diff -u internal/openapi/openapi.gen.go "$tmp_dir/openapi.gen.go"; then
          echo 'generated Go code is out of date' >&2
          exit 1
        fi

  test:
    desc: Go APIのユニットテストを実行する
    dir: '{{.ROOT_DIR}}/api'
    cmds:
      - go test ./...

  vet:
    desc: Go APIをgo vetで検査する
    dir: '{{.ROOT_DIR}}/api'
    cmds:
      - go vet ./...

  run:
    desc: Go APIをローカル起動する
    dir: '{{.ROOT_DIR}}/api'
    cmds:
      - go run ./cmd/api

  verify:
    desc: Go APIの生成物・テスト・静的検査をまとめて実行する
    cmds:
      - task: generate-check
      - task: test
      - task: vet
