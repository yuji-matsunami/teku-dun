openapi: 3.0.3
info:
  title: Teku Dun API
  version: 0.1.0
  description: |
    Teku Dun の HTTP API 契約。サーバ実装と Flutter クライアントの
    コード生成元として利用する。
servers:
  - url: /
    description: Current host
tags:
  - name: health
    description: Service health and readiness checks.
  - name: walk
    description: Walking session and sensor event ingestion.
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: getHealthz
      summary: Check whether the service is alive
      description: Returns a successful response when the API process is alive.
      security: []
      responses:
        '200':
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: The service could not answer the health check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /readyz:
    get:
      tags:
        - health
      operationId: getReadyz
      summary: Check whether the service is ready
      description: Returns a successful response when the service can accept requests.
      security: []
      responses:
        '200':
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: The service is not ready to accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: The service could not answer the readiness check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{session_id}:
    put:
      tags:
        - walk
      operationId: putSession
      summary: Create or update a walking session start time
      description: |
        Stores the start time for a walking session. The session identifier is
        supplied by the client and authentication is out of scope for this
        API contract. A session is the origin for one-minute step intervals;
        only the final partial interval is allowed by the client contract.
        The start time is immutable after the first accepted value. The server
        records the time at which the request is received.
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '204':
          description: Session start time accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sessions/{session_id}/locations/{event_id}:
    put:
      tags:
        - walk
      operationId: putLocation
      summary: Store or replay a location event
      description: |
        Stores a location event for a walking session. The server records the
        time at which the request is received. Authentication is out of scope
        for this API contract.
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/EventID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '204':
          description: Location event accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    SessionID:
      name: session_id
      in: path
      required: true
      description: Non-zero canonical UUID identifying the walking session.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    EventID:
      name: event_id
      in: path
      required: true
      description: Non-zero canonical UUID identifying the immutable event record.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  responses:
    BadRequest:
      description: The request body or path parameter is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The session does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The immutable value or revision conflicts with an accepted event.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The storage service could not process the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      description: Successful liveness check response.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    ReadyResponse:
      type: object
      description: Successful readiness check response.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
          example: ready
    ErrorResponse:
      type: object
      description: Standard error response returned by the API.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: service_unavailable
        message:
          type: string
          description: Human-readable error message.
          example: Service is not ready.
    SessionRequest:
      type: object
      additionalProperties: false
      required:
        - start_datetime
      properties:
        start_datetime:
          type: string
          format: date-time
          description: Immutable session start time in RFC 3339 format.
    LocationRequest:
      type: object
      additionalProperties: false
      required:
        - recorded_at
        - latitude
        - longitude
        - accuracy_m
      properties:
        recorded_at:
          type: string
          format: date-time
          description: Device-recorded time in RFC 3339 format; requests more than five minutes in the future are invalid.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude in decimal degrees.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude in decimal degrees.
        accuracy_m:
          type: number
          format: double
          minimum: 0
          description: Horizontal accuracy in metres.
